apiVersion: v1
kind: PersistentVolume
metadata:
  name: echobind-storage-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 100.103.64.86 # Pi's Tailscale IP — works whether laptops are on LAN or roaming
    path: /mnt/echobind-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: echobind-storage-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: echobind-storage-pv
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echobind-config
data:
  ECHOBIND_STORAGE_ROOT: /mnt/echobind-storage
  VAULT_PATH: /mnt/echobind-storage/obsidian-vault
  DATABASE_URL: sqlite:////mnt/echobind-storage/jobs.db
  OLLAMA_HOST: http://100.103.64.86:11434 # Tailscale IP, same reasoning as NFS above
  OLLAMA_MODEL: qwen3:8b
  WHISPER_MODEL: base
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echobind-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echobind-api
  template:
    metadata:
      labels:
        app: echobind-api
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: raspberrypi # matches actual node label, not raspberry.local
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: api
          image: joshnelson00/echobind-api:release
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: echobind-config
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8000"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt/echobind-storage
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: echobind-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: echobind-api
spec:
  selector:
    app: echobind-api
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: echobind-worker
spec:
  selector:
    matchLabels:
      app: echobind-worker
  template:
    metadata:
      labels:
        app: echobind-worker
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        role: worker
        gpu: nvidia
      containers:
        - name: worker
          image: joshnelson00/echobind-worker:release
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: echobind-config
          env:
            - name: WHISPER_DEVICE
              value: cuda
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              ephemeral-storage: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 1Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt/echobind-storage
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: echobind-storage-pvc
