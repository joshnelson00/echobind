name: echobind

services:
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    image: echobind-api:local
    restart: unless-stopped
    user: "${UID:-0}:${GID:-0}"
    environment:
      ECHOBIND_STORAGE_ROOT: ${ECHOBIND_STORAGE_ROOT:-/mnt/echobind-storage}
      VAULT_PATH: ${VAULT_PATH:-/mnt/echobind-storage/obsidian-vault}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////mnt/echobind-storage/jobs.db}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ${ECHOBIND_STORAGE_ROOT:-/mnt/echobind-storage}
        target: ${ECHOBIND_STORAGE_ROOT:-/mnt/echobind-storage}
        bind:
          create_host_path: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    image: echobind-worker:local
    restart: unless-stopped
    user: "${UID:-0}:${GID:-0}"
    environment:
      ECHOBIND_STORAGE_ROOT: ${ECHOBIND_STORAGE_ROOT:-/mnt/echobind-storage}
      VAULT_PATH: ${VAULT_PATH:-/mnt/echobind-storage/obsidian-vault}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////mnt/echobind-storage/jobs.db}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
    volumes:
      - type: bind
        source: ${ECHOBIND_STORAGE_ROOT:-/mnt/echobind-storage}
        target: ${ECHOBIND_STORAGE_ROOT:-/mnt/echobind-storage}
        bind:
          create_host_path: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
